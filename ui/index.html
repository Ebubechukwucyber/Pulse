<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PULSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand"><i></i>PULSE</div>
      <div class="brief">
        <span id="sev" class="sev">STANDBY</span>
        <div>
          <div id="service">no incident</div>
          <div id="brief" class="sub">Inject the checkout fixture to start.</div>
        </div>
      </div>
      <dl class="nums">
        <div><dt>error</dt><dd id="m-err">—</dd></div>
        <div><dt>p99</dt><dd id="m-p99">—</dd></div>
        <div><dt>deploy</dt><dd id="m-dep">—</dd></div>
        <div><dt>clock</dt><dd id="clock">00:00.0</dd></div>
      </dl>
      <div class="actions">
        <button type="button" id="replay">Replay</button>
        <button type="button" id="killcam">Kill-cam</button>
      </div>
    </header>

    <div class="agents" id="agents"></div>

    <main>
      <section class="col streams">
        <article>
          <h1>Sentry <span id="sentry-state">idle</span></h1>
          <div id="sentry" class="draft"></div>
        </article>
        <article>
          <h1>Triage <span id="triage-state">idle</span></h1>
          <div id="triage" class="draft"></div>
        </article>
        <article>
          <h1>Archaeologist <span id="arch-state">idle</span></h1>
          <div id="arch" class="draft"></div>
        </article>
        <article>
          <h1>Hypothesis <span id="hyp-state">idle</span></h1>
          <div id="hyp" class="draft"></div>
        </article>
        <article>
          <h1>Fixer <span id="fixer-state">idle</span></h1>
          <div id="fixer" class="draft"></div>
        </article>
        <article>
          <h1>RedTeam <span id="red-state">watching</span></h1>
          <div id="red-draft" class="draft"></div>
        </article>
      </section>
      <aside>
        <h1>Facts / Comms</h1>
        <div id="facts"></div>
      </aside>
    </main>

    <section class="lanes">
      <div class="lanes-h">
        <h1>Overlap</h1>
        <span id="overlap">waiting</span>
      </div>
      <div id="gantt"></div>
    </section>

    <footer class="cmd">
      <b class="cmd-label">Commander</b>
      <button type="button" id="join">Join</button>
      <button type="button" id="leave">Leave</button>
      <input id="cmd" type="text" maxlength="200" placeholder="Commander directive — page payments on-call too" />
      <button type="button" id="send">Send</button>
      <span id="status">connecting</span>
    </footer>
    <script>
      (function paintLive() {
        function set(id, text) {
          var el = document.getElementById(id);
          if (el && text) el.textContent = text;
        }
        function pull() {
          fetch("/api/snapshot")
            .then(function (r) { return r.json(); })
            .then(function (events) {
              if (!events || !events.length) return;
              set("status", "snapshot " + events.length + " events");
              events.forEach(function (ev) {
                var p = ev.payload || {};
                if (ev.type === "IncidentDeclared") {
                  set("service", p.service);
                  set("brief", p.symptom);
                  set("m-err", p.errorRate + "%");
                  set("m-p99", p.p99ms + "ms");
                  set("m-dep", p.deployAgeMin + "m");
                  set("sentry", [p.service, p.symptom].concat(p.rawLines || []).join("\n"));
                }
                if (ev.type === "SeveritySet") {
                  set("sev", p.sev);
                  var sev = document.getElementById("sev");
                  if (sev) sev.className = "sev " + p.sev;
                  set("brief", p.reason);
                  set("triage", p.sev + "\n" + p.reason);
                }
                if (ev.type === "EvidenceFound") set("arch", p.quote);
                if (ev.type === "HypothesisPosted") set("hyp", p.claim || p.title);
                if (ev.type === "FixDraftDelta" || ev.type === "FixDraftFinal") {
                  if (p.draftId === "draft-2") {
                    window.__pulseSafe = p.fullSoFar || p.text || window.__pulseSafe;
                  } else {
                    window.__pulseDraft = p.fullSoFar || p.text || window.__pulseDraft;
                  }
                }
                if (ev.type === "VetoIssued") {
                  window.__pulseVeto = p;
                  set("red-draft", (p.reason || "") + "\n" + (p.dangerousSpan || ""));
                }
              });
              var draft = window.__pulseDraft || "";
              var veto = window.__pulseVeto;
              var box = document.getElementById("fixer");
              if (box && draft) {
                if (veto && veto.dangerousSpan && draft.indexOf(veto.dangerousSpan) >= 0) {
                  var at = typeof veto.atChar === "number" ? veto.atChar : draft.indexOf(veto.dangerousSpan);
                  var end = at + String(veto.dangerousSpan).length;
                  function esc(s) {
                    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
                  }
                  box.innerHTML = esc(draft.slice(0, at)) + "<mark>" + esc(draft.slice(at, end)) + "</mark>" + esc(draft.slice(end));
                } else {
                  box.textContent = draft;
                }
              }
              if (window.__pulseSafe) {
                var red = document.getElementById("red-draft");
                var vetoLine = window.__pulseVeto
                  ? (window.__pulseVeto.reason || "") + "\n" + (window.__pulseVeto.dangerousSpan || "")
                  : "";
                if (red) red.textContent = vetoLine + "\n\nnext: " + window.__pulseSafe;
              }
            })
            .catch(function () {});
        }
        pull();
        setInterval(pull, 1000);
      })();
    </script>
    <script src="/app.js"></script>
  </body>
</html>
