<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PULSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand"><i></i>PULSE</div>
      <div class="brief">
        <span id="sev" class="sev">STANDBY</span>
        <div>
          <div id="service">no incident</div>
          <div id="brief" class="sub">Inject the checkout fixture to start.</div>
        </div>
      </div>
      <dl class="nums">
        <div><dt>error</dt><dd id="m-err">—</dd></div>
        <div><dt>p99</dt><dd id="m-p99">—</dd></div>
        <div><dt>deploy</dt><dd id="m-dep">—</dd></div>
        <div><dt>clock</dt><dd id="clock">00:00.0</dd></div>
      </dl>
      <div class="actions">
        <button type="button" id="replay">Replay</button>
        <button type="button" id="killcam">Kill-cam</button>
      </div>
    </header>

    <div class="agents" id="agents"></div>

    <main>
      <section class="col streams">
        <article>
          <h1>Fixer <span id="fixer-state">idle</span></h1>
          <div id="fixer" class="draft"></div>
        </article>
        <article>
          <h1>RedTeam <span id="red-state">watching</span></h1>
          <div id="red-draft" class="draft"></div>
        </article>
      </section>
      <aside>
        <h1>Facts</h1>
        <div id="facts"></div>
      </aside>
    </main>

    <section class="lanes">
      <div class="lanes-h">
        <h1>Overlap</h1>
        <span id="overlap">waiting</span>
      </div>
      <div id="gantt"></div>
    </section>

    <footer class="cmd">
      <button type="button" id="join">Join</button>
      <button type="button" id="leave">Leave</button>
      <input id="cmd" type="text" maxlength="200" placeholder="Directive — page payments on-call too" />
      <button type="button" id="send">Send</button>
      <span id="status">connecting</span>
    </footer>
    <script src="/app.js"></script>
  </body>
</html>
